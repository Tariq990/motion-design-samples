name: GPT Auto Mobile APK
on:
  push:
    branches:
      - experiment/gpt-auto-mobile-android
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Clone pinned WebGPT 6.29
        run: |
          git clone https://github.com/MrHuaweiFan/WebGPT.git upstream
          git -C upstream checkout --detach 0a0494a01d3a05dc4c21b5d35c3e8a3d40cbcd05
      - name: Apply Android customization
        run: python3 experiments/gpt-auto-mobile/patch_webgpt.py upstream
      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GPT-Auto-Mobile-debug-APK
          path: upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
